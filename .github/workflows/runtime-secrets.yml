name: Runtime secrets

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment whose secrets and variables are synced
        type: string
        default: production
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment whose secrets and variables are synced
        type: choice
        options:
          - production
        default: production

permissions: {}

jobs:
  sync:
    name: Sync GitHub → Openship
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    environment: ${{ inputs.environment || 'production' }}
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Sync allowlisted runtime configuration
        env:
          OPENSHIP_API_URL: ${{ secrets.OPENSHIP_CLOUD_API_URL }}
          OPENSHIP_API_TOKEN: ${{ secrets.OPENSHIP_CLOUD_API_TOKEN }}
          OPENSHIP_PROJECT_ID: ${{ secrets.OPENSHIP_CLOUD_PROJECT_ID }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          PHX_HOST: ${{ vars.PHX_HOST }}
          PORT: ${{ vars.PORT }}
        run: ./.github/scripts/openship-sync-runtime-env.sh
